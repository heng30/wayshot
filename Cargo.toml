[workspace]
resolver = "3"
default-members = ["wayshot"]
exclude = ["lib/lfm-vl-candle"]
members = ["wayshot", "wayshot-cursor", "tr-helper", "icon-helper", "lib/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
readme = "README.md"
license = "Apache-2.0 or GPLv3"
authors = ["Heng30 <rongheng30@gmail.com>"]
keywords = [
  "Rust",
  "GUI",
  "Wayland",
  "Linux",
  "wlr",
  "LLM",
  "share screen",
  "video editor",
  "push stream",
]
homepage = "https://github.com/Heng30/wayshot"
repository = "https://github.com/Heng30/wayshot"
description = "It's a screen recorder, video editor, share screen tool and push stream tool."

[profile.dev]
lto = false
debug = false
opt-level = 0
incremental = true

# https://github.com/johnthagen/min-sized-rust
[profile.release]
lto = true
strip = true
debug = false
panic = "abort"
opt-level = "s"
codegen-units = 1
incremental = true

