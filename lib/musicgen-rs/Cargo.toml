[package]
name = "musicgen-rs"
version.workspace = true
edition.workspace = true
keywords = ["music", "ai", "onnx", "inference", "audio"]
description = "MusicGen inference library for Rust — generate music from text prompts using ONNX Runtime"

[dependencies]
log.workspace = true
rand.workspace = true
ndarray.workspace = true
thiserror.workspace = true
num-traits.workspace = true
serde_json.workspace = true
tokenizers.workspace = true
serde = { workspace = true, features = ["derive"] }
half = { workspace = true, features = ["num-traits"] }
ort = { workspace = true, features = ["half", "ndarray"] }

[dev-dependencies]
hound.workspace = true
anyhow.workspace = true
indicatif.workspace = true
env_logger.workspace = true
clap = { workspace = true, features = ["derive"] }
