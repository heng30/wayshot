[package]
name = "lfm-vl-candle"
version.workspace = true
edition.workspace = true
description = "LFM2.5-VL inference library in Rust (candle)"

[dependencies]
num.workspace = true
rand.workspace = true
image.workspace = true
thiserror.workspace = true
minijinja.workspace = true
candle-nn.workspace = true
serde_json.workspace = true
tokenizers.workspace = true
candle-core.workspace = true
candle-transformers.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
ctrlc.workspace = true
anyhow.workspace = true

[features]
mkl = ["candle-nn/mkl", "candle-core/mkl", "candle-transformers/mkl"]
cuda = ["candle-nn/cuda", "candle-core/cuda", "candle-transformers/cuda"]
metal = ["candle-nn/metal", "candle-core/metal", "candle-transformers/metal"]
